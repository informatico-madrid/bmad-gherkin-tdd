[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmad-gherkin-tdd"
version = "0.1.0"
requires-python = ">=3.11"
description = "Contract-first TDD development methodology module for BMAD projects"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["bmad_gherkin_tdd*"]

[tool.ruff]
line-length = 100
target-version = "py311"
