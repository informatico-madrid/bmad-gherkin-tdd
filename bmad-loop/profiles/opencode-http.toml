# --- bmad-loop adapter profile: opencode-http (dev) ---
# Routes the unattended dev primitive through bmad-dev-auto, which drives the
# TDD coordinator (bmad-gherkin-tdd module) via its implementation_handoff and
# then runs the outer Verify → Review → closure (Auto Run Result, status: done,
# completion marker). NEVER route dev directly to the coordinator: the review
# step lives in bmad-dev-auto, not in the coordinator.
#
name = "opencode-http"
binary = "opencode"
prompt_template = "Run the bmad-dev-auto skill on this story now: /bmad-dev-auto {args}"
usage_parser = "none"
skill_tree = ".agents/skills"
first_run_note = "run opencode auth login once on this machine; headless servers reuse stored credentials"

# Project overlays replace the packaged profile, so retain the provider and
# transport fault patterns needed to classify OpenCode server failures.
env_fault_patterns = [
  'error[.]error="AI_APICallError: [^"]{0,400}?(?i:usage limit(?: has been)? reached|429|too many requests|rate[ _-]?limit|quota|overloaded)',
  'error[.]error="AI_APICallError: [^"]{0,400}?(?i:cannot connect to api|socket connection was closed|connection ?(error|refused|reset|timed ?out)|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN)',
]

[hooks]
dialect = "none"
