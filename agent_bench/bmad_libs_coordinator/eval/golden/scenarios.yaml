# Scenarios for coordinator benchmark.
# Each scenario: project state + trigger → expected decision.
# The coordinator's job: make the RIGHT orchestration choice.

scenarios:
  - id: concurrent_run_blocked
    trigger: "A new story is ready for development, but a run for story 3-2 is still active (pid 12345, started 20 min ago, last heartbeat 2 min ago)."
    state:
      human_present: "no"
      active_runs: ["3-2-export"]
      sprint_status:
        - key: "3-2-export"
          status: in-progress
        - key: "4-1-dispatch"
          status: ready-for-dev
    expected_decision: "DO NOT launch 4-1. The coordinator must NOT launch concurrent runs. Wait for 3-2 to complete or intervene if it's stalled."
    rule_violated_if_wrong: "Critical Rule 1: NUNCA lanzar múltiples runs simultáneos"

  - id: stale_run_intervene
    trigger: "Run for story 3-2 has been running for 45 minutes. Last heartbeat was 30 minutes ago. No output in the log for 25 minutes."
    state:
      human_present: "no"
      active_runs: ["3-2-export"]
      last_heartbeat_minutes_ago: 30
      log_silent_minutes: 25
    expected_decision: "INTERVENE: the run is stalled (no heartbeat for 30 min). Read the log to find root cause, then re-drive or escalate."
    rule_violated_if_wrong: "Critical Rule 4: Intervenir tan pronto como haya síntoma"

  - id: human_absent_no_question
    trigger: "Story 5-1 has an ambiguous spec. The coordinator needs to decide how to handle it."
    state:
      human_present: "no"
      sprint_status:
        - key: "5-1-auth"
          status: ready-for-dev
    expected_decision: "DO NOT use the question tool. Resolve ambiguity from the planning corpus (epics, PRD, spec). If truly unresolvable, escalate as CRITICAL."
    rule_violated_if_wrong: "Critical Rule 9: human-present=no → PROHIBIDO question"

  - id: no_setid_rejected
    trigger: "Need to launch a new run for story 4-1."
    state:
      human_present: "yes"
      active_runs: []
      sprint_status:
        - key: "4-1-dispatch"
          status: ready-for-dev
    expected_decision: "Launch using 'setsid bash -c ...' or 'tmux new-session'. NEVER use nohup."
    rule_violated_if_wrong: "Critical Rule 5: Usar setsid/tmux para lanzar (nunca nohup)"

  - id: commit_before_resolve
    trigger: "There are uncommitted changes in the worktree. A resolve is needed for story 3-2's escalation."
    state:
      human_present: "yes"
      has_uncommitted_changes: true
      needs_resolve: "3-2-export"
    expected_decision: "COMMIT first, THEN resolve. The worktree may be replaced during resolve."
    rule_violated_if_wrong: "Critical Rule 6: COMMITEAR antes de resolve/resume"

  - id: done_without_verify
    trigger: "A dev session just completed story 4-1. The coordinator should review."
    state:
      human_present: "yes"
      story_status: "dev-complete"
      tests_on_head: "not run yet"
    expected_decision: "Run the project test suite on HEAD to verify. Do NOT mark as done until tests pass. Verify subagent output against real code."
    rule_violated_if_wrong: "Critical Rules 7+8: VERIFICAR output de subagentes + verificar post-merge en HEAD"
