surfaces:
  # ── Gate: cleaner-gate checks ──────────────────────────────────────
  - id: gate_kiss
    category: gate
    description: "KISS: complexity ≤10, nesting ≤4, arity ≤5"
  - id: gate_dry
    category: gate
    description: "DRY: no duplicate 6+ line blocks"
  - id: gate_yagni
    category: gate
    description: "YAGNI: no unused imports, no dead code"
  - id: gate_lod
    category: gate
    description: "LoD: attribute chains ≤3"
  - id: gate_coi
    category: gate
    description: "CoI: inheritance depth ≤2"
  - id: gate_scan
    category: gate
    description: "scan_mutation_sites: ≤ threshold"
  - id: gate_coverage
    category: gate
    description: "Coverage 100% in diff files"
  - id: gate_pytest
    category: gate
    description: "pytest PASS"

  # ── Anti-shell (structural) ────────────────────────────────────────
  - id: no_empty_extract
    category: anti_shell
    description: "No _fn() with body ≤1 stmt"
  - id: no_pass_body
    category: anti_shell
    description: "No bare pass in refactored functions"
  - id: no_pragma_mutate
    category: anti_shell
    description: "No # pragma: no mutate"
  - id: no_new_tests
    category: anti_shell
    description: "No new test files"
  - id: no_test_tamper
    category: anti_shell
    description: "Gold test hash matches"
  - id: behavior_lock
    category: anti_shell
    description: "Hidden tests must not decrease vs semilla"

