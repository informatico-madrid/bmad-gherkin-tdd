code: gherkin-tdd
name: BMAD Gherkin TDD
description: "Contract-first TDD development methodology: signed Gherkin dev-contracts (@s1..@sn), a strict RED→GREEN→CLEAN→REFACTOR coordinator, durable per-scenario bitácora, and integration with bmad-loop. Installs the gherkin-author, bmad-tdd-coordinator, tdd-red/green/clean/refactor skills and wires the bmad-dev-auto handoff to the coordinator."
module_version: 0.1.0
default_selected: false
module_greeting: >
  BMAD Gherkin TDD installed — contract-first TDD development methodology.
  The module lays the gherkin-author, bmad-tdd-coordinator, tdd-red, tdd-green,
  tdd-clean and tdd-refactor skills into your skill tree, and overrides the
  bmad-dev-auto implementation handoff so every story is driven through the
  TDD coordinator (signed contract → RED → GREEN → CLEAN → REFACTOR → bitácora).
  It integrates with bmad-loop (dev adapter routes to the coordinator). Requires
  the BMad Method (bmm) module and, for autonomous loops, the bmad-loop module.
  To upgrade later, just re-run /bmad-gherkin-tdd-setup (or /bmad-gherkin-tdd-setup upgrade).

# Directories to create during installation (declarative, no code execution)
directories:
  - "{contracts_dir}"
  - "{implementation_artifacts}"

contracts_dir:
  prompt: "Where do Gherkin dev-contract .feature files live?"
  default: "tests/contracts"
  result: "{project-root}/{value}"
  user_setting: false
